name: Build executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/build-executables.yml"
      - "packaging/**"
      - "src/**"
      - "requirements*.txt"
      - "config.json"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AskTheBook-windows-x64
            output: dist/
          - os: ubuntu-22.04
            artifact: AskTheBook-ubuntu-22.04-x64
            output: AskTheBook-ubuntu-22.04-x64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name AskTheBook --paths .
          --collect-all faiss --collect-all pymupdf
          --collect-submodules uvicorn --collect-submodules python_multipart
          packaging/entry.py

      - name: Include setup instructions and configuration
        shell: pwsh
        run: |
          Copy-Item config.json dist/config.json
          Copy-Item README.md dist/README.md
          Copy-Item LICENSE dist/LICENSE

      - name: Preserve Linux executable permissions
        if: runner.os == 'Linux'
        run: tar -czf AskTheBook-ubuntu-22.04-x64.tar.gz -C dist .

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: AskTheBook-windows-x64
          path: release/windows

      - uses: actions/download-artifact@v6
        with:
          name: AskTheBook-ubuntu-22.04-x64
          path: release

      - name: Package Windows release
        working-directory: release/windows
        run: zip -r ../AskTheBook-windows-x64.zip .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          assets=(release/AskTheBook-windows-x64.zip release/AskTheBook-ubuntu-22.04-x64.tar.gz)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes
          fi
